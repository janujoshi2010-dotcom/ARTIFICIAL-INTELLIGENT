<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mera Personal AI</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: #18181b; color: #f4f4f5; height: 100vh; display: flex; flex-direction: column; }
    
    header { padding: 14px 24px; background: #09090b; border-bottom: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
    .brand-icon { width: 12px; height: 12px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }
    
    .actions { display: flex; gap: 10px; }
    .btn-secondary { background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: 0.2s; font-weight: 500; }
    .btn-secondary:hover { background: #3f3f46; }

    #chat-box { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; max-width: 820px; width: 100%; margin: 0 auto; }
    
    .msg-group { display: flex; gap: 12px; width: 100%; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-group.user { justify-content: flex-end; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .bot-avatar { background: #2563eb; color: #fff; }
    
    .bubble { max-width: 80%; padding: 12px 18px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .user .bubble { background-color: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .bot .bubble { background-color: #27272a; color: #f4f4f5; border-bottom-left-radius: 4px; border: 1px solid #3f3f46; }
    .bubble.error { background-color: #451a1a; border-color: #7f1d1d; color: #fca5a5; }

    #input-container { padding: 16px 20px 24px; background: #18181b; display: flex; justify-content: center; }
    .input-wrapper { max-width: 820px; width: 100%; position: relative; background: #27272a; border-radius: 20px; padding: 8px 14px; display: flex; align-items: center; border: 1px solid #3f3f46; }
    .input-wrapper:focus-within { border-color: #2563eb; }
    
    textarea { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; resize: none; max-height: 120px; padding: 6px 8px; font-family: inherit; }
    textarea::placeholder { color: #71717a; }
    
    button#send-btn { background: #2563eb; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 16px; font-weight: bold; transition: 0.2s; }
    button#send-btn:hover { background: #1d4ed8; }
    button#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"></div>
      <span>Personal AI Assistant</span>
    </div>
    <div class="actions">
      <button class="btn-secondary" onclick="setupKey()">🔑 Set API Key</button>
      <button class="btn-secondary" onclick="clearChat()">🗑️ Clear</button>
    </div>
  </header>

  <div id="chat-box">
    <div class="msg-group bot">
      <div class="avatar bot-avatar">AI</div>
      <div class="bubble bot">Namaste! Main aapka AI assistant hoon. Upar <b>"🔑 Set API Key"</b> par click karke apni key dalein aur sawal poochhein!</div>
    </div>
  </div>

  <div id="input-container">
    <div class="input-wrapper">
      <textarea id="user-input" rows="1" placeholder="Yahan apna sawal likhein... (Enter daba kar bhejein)" onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    // Agar local storage khali ho toh default key set kar dega
    const DEFAULT_KEY = "AQ.Ab8RN6KKmVJ5b1p5ckJOH_fzDrgYiMEx7U6Bhh-VaD4l4fgyqQ";

    function getKey() {
      return localStorage.getItem("gemini_user_api_key") || DEFAULT_KEY;
    }

    function setupKey() {
      const savedKey = getKey();
      const userKey = prompt("Apni API Key yahan paste karein:", savedKey);
      if (userKey !== null) {
        const cleaned = userKey.trim().replace(/\s+/g, "");
        if (cleaned) {
          localStorage.setItem("gemini_user_api_key", cleaned);
          alert("Key successfully update ho gayi!");
        }
      }
    }

    function clearChat() {
      document.getElementById("chat-box").innerHTML = `
        <div class="msg-group bot">
          <div class="avatar bot-avatar">AI</div>
          <div class="bubble bot">Chat clear kar di gayi hai.</div>
        </div>
      `;
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function callGemini(apiKey, text) {
      // Wahi exact endpoint jo aapke curl command me tha
      const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
      
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-goog-api-key": apiKey
        },
        body: JSON.stringify({
          contents: [{ parts: [{ text: text }] }]
        })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || ("Error Code: " + res.status));
      }
      return data.candidates[0].content.parts[0].text;
    }

    async function sendMessage() {
      const apiKey = getKey();
      const input = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      const sendBtn = document.getElementById("send-btn");
      const text = input.value.trim();

      if (!text) return;

      chatBox.innerHTML += `
        <div class="msg-group user">
          <div class="bubble">${text}</div>
        </div>
      `;
      input.value = "";
      sendBtn.disabled = true;
      chatBox.scrollTop = chatBox.scrollHeight;

      const botGroup = document.createElement("div");
      botGroup.className = "msg-group bot";
      botGroup.innerHTML = `
        <div class="avatar bot-avatar">AI</div>
        <div class="bubble bot">Soch raha hoon...</div>
      `;
      chatBox.appendChild(botGroup);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const reply = await callGemini(apiKey, text);
        botGroup.querySelector(".bubble").innerText = reply;
      } catch (err) {
        const bubble = botGroup.querySelector(".bubble");
        bubble.className = "bubble bot error";
        bubble.innerText = "Error: " + err.message;
      }

      sendBtn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
